# ─────────────────────────────────────────────────────────────
# PAGES CMS — the editing screen for participa.design
# Sign in at https://app.pagescms.org with GitHub and choose this repository.
# Each page is a form; save, and GitHub publishes the change in a minute or two.
# merge: true keeps any field the forms do not show (layout, noindex…).
# The paths point at the lab pages; at launch they move with the pages.
# Note: this repository is public.
# ─────────────────────────────────────────────────────────────
media:
- name: images
  label: Images
  input: images
  output: /images
  categories:
  - image
- name: files
  label: Downloads
  input: files
  output: /files
  categories:
  - document
settings:
  content:
    merge: true
content:
- name: pages
  label: Pages
  type: group
  items:
  - name: home
    label: Home
    type: file
    path: lab/home/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: statement
      label: Main title
      type: text
    - name: intro
      label: Intro
      type: text
    - name: actions
      label: Buttons
      type: object
      fields: &id001
      - name: title
        label: Text
        type: string
      - name: url
        label: Link (e.g. /lab/profile/ or https://…)
        type: string
      list: true
    - name: highlights
      label: Company panel (beside the main title)
      type: object
      fields:
      - name: org
        label: Company
        type: string
      - name: role
        label: Role
        type: string
      - name: link
        label: Link to the case
        type: string
      list: true
    - name: highlights_link
      label: Link at the bottom of the panel
      type: object
      fields: *id001
    - name: work_heading
      label: Heading above the case
      type: string
    - name: work_link
      label: Link under the case
      type: object
      fields: *id001
  - name: profile
    label: Profile
    type: file
    path: lab/profile/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: person
      label: Name (large title)
      type: string
    - name: headline
      label: Headline
      type: string
    - name: portrait
      label: Portrait (upright, 4:5)
      type: image
      options:
        media: images
    - name: portrait_square
      label: Portrait for phones (square crop on the face)
      type: image
      options:
        media: images
    - name: portrait_alt
      label: Portrait description (for screen readers)
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: name_line
      label: Line on the name Participa
      type: text
    - name: location
      label: Location
      type: string
    - name: practice
      label: Longer text (links as [text](https://…))
      type: text
    - name: experience_heading
      label: Heading above the experience
      type: string
    - name: experience
      label: Experience
      type: object
      fields:
      - name: org
        label: Organisation
        type: string
      - name: years
        label: Years
        type: string
      - name: role
        label: Role
        type: string
      - name: result
        label: Result line
        type: text
      - name: link
        label: Link to the case
        type: string
      list: true
    - name: earlier
      label: Line under the experience
      type: text
    - name: pdf
      label: CV download
      type: object
      fields:
      - name: file
        label: PDF (leave empty while in preparation)
        type: file
        options:
          media: files
      - name: updated
        label: Updated (e.g. November 2026)
        type: string
      - name: note
        label: Line under the box
        type: string
    - name: sides
      label: Sister panel
      type: object
      fields:
      - name: own
        label: Which side
        type: select
        options:
          values:
          - design
          - studio
      - name: name
        label: Name
        type: string
      - name: tag
        label: Small label
        type: string
      - name: url
        label: Link
        type: string
      - name: text
        label: Text
        type: text
      - name: links
        label: Links
        type: object
        fields: *id001
        list: true
      list: true
    - name: contact
      label: Closing line (links as [text](https://…))
      type: text
  - name: contact
    label: Contact
    type: file
    path: lab/contact/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: heading
      label: Main title
      type: string
    - name: intro
      label: Intro
      type: text
    - name: offers
      label: Offers
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: text
        label: Text
        type: text
      - name: subject
        label: Email subject
        type: string
      - name: button
        label: Button text
        type: string
      list: true
    - name: other_heading
      label: Closing heading
      type: string
    - name: other
      label: Closing line (links as [text](https://…))
      type: text
  - name: cases_page
    label: Work page
    type: file
    path: lab/work/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: heading
      label: Main title
      type: string
    - name: intro
      label: Intro
      type: text
    - name: empty
      label: Text when the list is empty
      type: string
- name: cases
  label: Cases
  type: group
  items:
  - name: tip
    label: TiP — LEGO
    type: file
    path: lab/tip/index.md
    fields:
    - name: title
      label: Page title
      type: string
      required: true
    - name: short_title
      label: Card title (Cases page and home; empty = page title)
      type: string
    - name: summary
      label: Card line (short line under the title on the card)
      type: string
    - name: org
      label: Organisation
      type: string
    - name: years
      label: Years
      type: string
    - name: featured
      label: Can be the case on the home page
      type: boolean
    - name: order
      label: Position on the list (lower numbers first)
      type: number
    - name: cover
      label: Card image
      type: image
      options:
        media: images
    - name: cover_alt
      label: Card image description (for screen readers)
      type: string
    - name: lead
      label: Opening line
      type: text
    - name: facts
      label: Facts (label + value)
      type: object
      fields:
      - name: label
        label: Label
        type: string
      - name: value
        label: Value
        type: string
      list: true
    - name: photos
      label: Photos
      type: object
      fields:
      - name: src
        label: Image
        type: image
        options:
          media: images
      - name: caption
        label: Caption
        type: string
      list: true
    - name: video
      label: Video (YouTube)
      type: object
      fields:
      - name: youtube
        label: YouTube video id (the part after youtu.be/)
        type: string
      - name: caption
        label: Caption (links as [text](https://…))
        type: string
    - name: challenge
      label: Challenge
      type: text
    - name: approach
      label: Approach
      type: text
    - name: outcome
      label: Outcome
      type: text
    - name: quote
      label: Quote (one)
      type: object
      fields: &id002
      - name: text
        label: Quote
        type: text
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: place
        label: Place
        type: string
    - name: quotes
      label: Quotes (two or more; they rotate — use instead of Quote)
      type: object
      fields: *id002
      list: true
    - name: artefacts
      label: Downloads
      type: object
      fields:
      - name: label
        label: Name
