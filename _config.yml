remote_theme: participa-studio/participa-core
plugins:
  - jekyll-remote-theme

# Files that are for us, not for visitors
exclude:
  - README.md

participa:
  core: https://participa-studio.github.io/participa-core
  version: 20261105-13          # raise this after every core change

  title: P A R T I C I P A º D E S I G N
  og_title: Participa Design
  description: "Participa Design: the service and participatory design portfolio of Bernardo van de Schepop."

  own: design                  # which logo is ours
  name: Design                 # label next to our logo
  name_full: Participa Design

  sister:
    own: studio
    name: Studio
    name_full: Participa Studio
    url: https://participa.studio/lab/home/       # lab: sister logo opens the other lab home (back to https://participa.studio/ at launch)

  nav:
    - title: Cases
      url: /lab/work/
      layouts: [case]
    - title: Experience
      url: /lab/cv/
    - title: About
      url: /lab/about/

  kvk: "42023602"
  instagram: https://www.instagram.com/participa.studio/
  linkedin: https://www.linkedin.com/in/schepop/
  email: bernardo@schepop.org
