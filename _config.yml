# ─────────────────────────────────────────────────────────────
# PARTICIPA . DESIGN — SITE SETTINGS
# The shared look (header, footer, layouts) comes from participa-core.
# This file only says what is different about this site.
# ─────────────────────────────────────────────────────────────

remote_theme: participa-studio/participa-core
plugins:
  - jekyll-remote-theme

# Files that are for us, not for visitors
exclude:
  - README.md

participa:
  core: https://participa-studio.github.io/participa-core
  version: 20261111-18          # raise this after every core change
  goo: true                    # connected-dots texture over case images (11 Nov 2026; core js/goo.js)

  title: P A R T I C I P A º D E S I G N
  og_title: Participa Design
  description: "Participa Design: the service and participatory design portfolio of Bernardo vd Schepop."

  own: design                  # which logo is ours
  name: Design                 # label next to our logo
  name_full: Participa Design

  home_url: /lab/home/        # lab: the left logo opens the lab home (remove at launch, back to /)
  sister:
    own: studio
    name: Studio
    name_full: Participa Studio
    url: https://participa.studio/lab/home/       # lab: sister logo opens the other lab home (back to https://participa.studio/ at launch)

  nav:
    - title: Work
      url: /lab/work/
      layouts: [case]
    - title: Profile
      url: /lab/profile/
    - title: Contact
      url: /lab/contact/

  kvk: "42023602"
  instagram: https://www.instagram.com/participa.design/
  linkedin: https://www.linkedin.com/in/schepop/
  email: bernardo@schepop.org
